<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Flipbook 3D Bertindak Sesuai Norma</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap">
<style>
:root{--bg:#E9ECF5;--ink:#1B2340;--muted:#566080;--paper:#FCFCFE;--line:#D3D9EA;--brand:#3338C9;--cover:#1B2155;--soft:#F0F2FA;--a:#0B7263;--ab:#DCF3EE;--s:#1F5CC4;--sb:#DFEAFC;--k:#8A5000;--kb:#FFEFCC;--h:#B02F2B;--hb:#FBE0DE;--fd:"Fredoka","Trebuchet MS",sans-serif;--fb:"Nunito",system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0E1325;--ink:#E9ECF8;--muted:#A9B1CE;--paper:#1A2038;--line:#303A62;--brand:#8E91FF;--cover:#232A68;--soft:#222A4A;--a:#52D3BB;--ab:#12332E;--s:#84B4FF;--sb:#15294F;--k:#F3BB52;--kb:#3A2B0E;--h:#FF8F89;--hb:#41191A;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0E1325;--ink:#E9ECF8;--muted:#A9B1CE;--paper:#1A2038;--line:#303A62;--brand:#8E91FF;--cover:#232A68;--soft:#222A4A;--a:#52D3BB;--ab:#12332E;--s:#84B4FF;--sb:#15294F;--k:#F3BB52;--kb:#3A2B0E;--h:#FF8F89;--hb:#41191A;color-scheme:dark}
html,body{height:100%;margin:0}*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);display:flex;flex-direction:column;overflow:hidden}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 14px;flex:none}
.bar b{font:600 1rem var(--fd)}.bar small{display:block;font-size:.72rem;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
.tb{border:1.5px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 13px;font-weight:700;font-size:.82rem}
.tb:hover{border-color:var(--brand)}.tb:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;perspective:2600px;touch-action:pan-y}
.book{position:relative;width:calc(var(--w)*2);height:var(--h);transform-style:preserve-3d;transition:transform .8s ease}
.leaf{position:absolute;left:50%;top:0;width:var(--w);height:100%;transform-origin:left center;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.45,.05,.25,1)}
.leaf.f{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--paper);overflow:hidden;box-shadow:0 8px 24px rgba(10,15,50,.22)}
.face.fr{border-radius:2px 10px 10px 2px;border-left:1px solid var(--line)}.face.bk{transform:rotateY(180deg);border-radius:10px 2px 2px 10px}
.pg{height:100%;overflow:auto;padding:22px 22px 40px;font-size:.88rem;line-height:1.55}
.face.fr::after,.face.bk::after{content:"";position:absolute;top:0;bottom:0;width:26px;pointer-events:none}
.face.fr::after{left:0;background:linear-gradient(90deg,rgba(0,0,0,.14),transparent)}.face.bk::after{right:0;background:linear-gradient(270deg,rgba(0,0,0,.14),transparent)}
h2{font:600 1.3rem/1.25 var(--fd);margin:0 0 4px}h3{font:600 1rem/1.3 var(--fd);margin:14px 0 4px;color:var(--brand)}
p{margin:6px 0}.bab{font-size:.78rem;color:var(--muted);font-weight:700}
ol{list-style:none;padding:0;margin:6px 0;counter-reset:n}ol>li{counter-increment:n;position:relative;padding-left:1.9em;margin:4px 0}
ol>li::before{content:counter(n) ".";position:absolute;left:0;font-weight:700;color:var(--brand)}ol.a>li::before{content:counter(n,lower-alpha) "."}
table{border-collapse:collapse;width:100%;font-size:.8rem;margin:8px 0}th,td{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}th{background:var(--soft)}
.t{display:inline-block;padding:1px 7px;border-radius:4px;font-weight:700;font-size:.78rem}.ta{background:var(--ab);color:var(--a)}.ts{background:var(--sb);color:var(--s)}.tk{background:var(--kb);color:var(--k)}.th{background:var(--hb);color:var(--h)}
.cover{background:var(--cover);color:#fff;display:flex;flex-direction:column;justify-content:center;padding:34px 28px;height:100%}
.cover h1{font:600 2rem/1.15 var(--fd);margin:0 0 10px}.cover p{color:#D5D9F5}
.vid{position:relative;padding-top:56.25%;border-radius:8px;overflow:hidden;background:#000;margin:8px 0}.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.btn{display:inline-block;padding:7px 14px;border-radius:8px;background:var(--brand);color:#fff;text-decoration:none;font-weight:700;font-size:.82rem}
.toc a{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);color:inherit;text-decoration:none}.toc a:hover{color:var(--brand)}
.foot{flex:none;display:flex;justify-content:center;align-items:center;gap:12px;padding:8px 14px 12px;font-size:.82rem;color:var(--muted)}
@media(max-width:760px){.stage{perspective-origin:15% 50%}.book{width:var(--w)}.leaf{left:0;transition:transform 1.1s cubic-bezier(.45,.05,.25,1)}.leaf.f{opacity:0;pointer-events:none;transition:transform 1.1s cubic-bezier(.45,.05,.25,1),opacity .2s .95s}.face.fr{box-shadow:-6px 8px 24px rgba(10,15,50,.35)}}
@media(prefers-reduced-motion:reduce){.leaf,.book{transition:none}}
</style></head><body>
<div class="bar"><div><b>Flipbook Bertindak Sesuai Norma</b><small>Pendidikan Pancasila Kelas VII · Bab 3 Patuh terhadap Norma</small></div><div><button class="tb" id="toc">Daftar Isi</button> <button class="tb" id="th">Tema</button></div></div>
<div class="stage" id="stage"><div class="book" id="book"></div></div>
<div class="foot"><button class="tb" id="pv">‹ Sebelumnya</button><span id="pi"></span><button class="tb" id="nx">Berikutnya ›</button></div>
<script>
const V='72gydS0MqDg',B=x=>x;
const tb=(r)=>`<table><tr><th>Norma</th><th>Bersumber dari</th><th>Sanksi</th></tr>${r}</table>`;
const N={a:'<span class="t ta">Agama</span>',s:'<span class="t ts">Kesusilaan</span>',k:'<span class="t tk">Kesopanan</span>',h:'<span class="t th">Hukum</span>'};
const S=[
{c:'Bertindak Sesuai Norma',e:['📖','🙏','🤝'],l:B(`<div class="bab">Materi Ajar Digital</div><h3>Selamat Datang</h3><p>Mari mempelajari norma bersama-sama melalui flipbook pop-up ini.</p>`),r:B(`<h3>Bab 3 Patuh terhadap Norma</h3><p>Bertindak Sesuai Norma dalam Kehidupan Sehari-hari</p><p>Pendidikan Pancasila Kelas VII (Fase D)</p>`)},
{c:'Daftar Isi',e:['📑'],l:B(`<div class="toc" id="t1"></div>`),r:B(`<div class="toc" id="t2"></div>`)},
{c:'Bab 1 Pendahuluan',e:['🎯','❓'],l:B(`<h3>1.1 Tujuan Pembelajaran</h3><p>Setelah mempelajari flipbook ini, murid mampu:</p><ol><li>menjelaskan arti penting bertindak sesuai norma;</li><li>menganalisis tindakan di lingkungan keluarga, sekolah, masyarakat, serta bangsa dan negara, lalu mengklasifikasikannya ke norma agama, kesusilaan, kesopanan, atau hukum beserta alasan dan sanksinya;</li><li>menghargai perbedaan cara menerapkan norma yang nilainya sama.</li></ol>`),r:B(`<h3>1.2 Pertanyaan Penyelidikan</h3><p><i>“Dapatkah satu tindakan berkaitan dengan lebih dari satu norma?”</i></p>`)},
{c:'1.3 Video Pembelajaran',e:['🎬','👀'],l:B(`<p>Simaklah video berikut dengan saksama.</p>`),r:B(`<a class="btn" href="https://youtu.be/${V}" target="_blank" rel="noopener">Buka di YouTube</a><p>Gunakan tombol di atas apabila video tidak tampil.</p><div class="vid"><iframe src="https://www.youtube-nocookie.com/embed/${V}" title="Video pembelajaran tentang norma" allow="encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`)},
{c:'Bab 2 Arti Penting Norma',e:['📜','⚖️','🧭'],l:B(`<h3>2.1 Pengertian Norma</h3><p>Norma adalah aturan atau pedoman berperilaku yang berlaku dalam kehidupan bersama.</p>`),r:B(`<h3>2.2 Syarat Berlakunya Norma</h3><p>Suatu norma berlaku apabila memuat empat unsur berikut.</p><ol><li><b>Perintah</b>: hal yang harus dilakukan.</li><li><b>Larangan</b>: hal yang tidak boleh dilakukan.</li><li><b>Sanksi</b>: akibat bagi pelanggar.</li><li><b>Mengikat</b>: berlaku bagi semua anggota masyarakat yang terkait.</li></ol>`)},
{c:'2.3 Fungsi dan 2.4 Pentingnya Norma',e:['🛡️','🌱'],l:B(`<h3>2.3 Fungsi Norma</h3><p>Norma mengatur perilaku agar kehidupan bersama berlangsung tertib, aman, dan nyaman.</p>`),r:B(`<h3>2.4 Pentingnya Bertindak Sesuai Norma</h3><p>Tanpa norma, setiap orang bertindak menurut kehendak sendiri sehingga mudah terjadi benturan. Dengan bertindak sesuai norma:</p><ol class="a"><li>hak dan keselamatan orang lain terlindungi;</li><li>hubungan antaranggota keluarga, sekolah, dan masyarakat terjaga;</li><li>kebiasaan baik tumbuh menjadi karakter, seperti jujur, disiplin, dan bertanggung jawab.</li></ol>`)},
{c:'Bab 3 Ciri dan Sanksi Empat Norma',e:['🙏','💛','🤝','⚖️'],l:B(`<h3>3.1 Ringkasan</h3>${tb(`<tr><td>${N.a}</td><td>Tuhan (ajaran agama)</td><td>Dosa</td></tr><tr><td>${N.s}</td><td>Hati nurani</td><td>Rasa bersalah, malu, takut, menyesal</td></tr><tr><td>${N.k}</td><td>Kebiasaan masyarakat</td><td>Ditegur, dicemooh, dikucilkan</td></tr><tr><td>${N.h}</td><td>Lembaga yang berwenang</td><td>Sanksi tegas</td></tr>`)}`),r:B(`<h3>3.2 Ciri Setiap Norma</h3><ol class="a"><li>${N.a} Berasal dari perintah dan larangan Tuhan; sanksinya berupa dosa yang dipertanggungjawabkan kepada Tuhan.</li><li>${N.s} Berasal dari hati nurani; tidak ada orang lain yang menghukum, tetapi pelanggarnya merasa bersalah, malu, takut, atau menyesal.</li></ol>`)},
{c:'3.2 Ciri Setiap Norma (lanjutan)',e:['🤝','⚖️'],l:B(`<ol class="a" style="counter-reset:n 2"><li>${N.k} Berasal dari kebiasaan yang diterima masyarakat; pelanggarnya mendapat sanksi sosial.</li><li>${N.h} Dibuat oleh lembaga berwenang, tertulis, mengikat, dan memaksa; pelanggarnya dikenai sanksi tegas.</li></ol>`),r:B(`<p>Keempat norma berbeda dalam <b>sumber</b> dan <b>sanksinya</b>, tetapi sama-sama mengatur perilaku manusia dalam kehidupan bersama.</p>`)},
{c:'Bab 4 Empat Lingkungan',e:['🏠','🏫','🏘️','🇮🇩'],l:B(`<h3>4.1 Contoh Tindakan Sesuai Norma</h3><table><tr><th>Lingkungan</th><th>Contoh</th></tr><tr><td>Keluarga</td><td>Berpamitan kepada orang tua; membantu pekerjaan rumah</td></tr><tr><td>Sekolah</td><td>Memakai seragam sesuai tata tertib; menyapa guru</td></tr><tr><td>Masyarakat</td><td>Antre dengan tertib; menyapa tetangga; membuang sampah pada tempatnya</td></tr><tr><td>Bangsa dan negara</td><td>Menaati peraturan lalu lintas; menghargai teman yang berbeda agama</td></tr></table>`),r:B(`<h3>4.2 Satu Nilai, Banyak Cara</h3><p>Keluarga, kebiasaan, dan lingkungan setiap murid beragam, sehingga cara menerapkan norma dapat berbeda, tetapi nilai yang mendasarinya sama, yaitu:</p><ol class="a"><li>kejujuran;</li><li>tanggung jawab;</li><li>hormat kepada orang tua;</li><li>disiplin;</li><li>gotong royong;</li><li>sikap menghargai perbedaan.</li></ol>`)},
{c:'Bab 5 Satu Tindakan, Banyak Norma',e:['📱','🔗','⚖️'],l:B(`<h3>5.1 Contoh</h3><p>Mengambil <i>smartphone</i> milik orang lain tanpa izin:</p><table><tr><td>${N.a}</td><td>Perbuatan dosa.</td></tr><tr><td>${N.s}</td><td>Menimbulkan rasa bersalah dan menyesal.</td></tr><tr><td>${N.k}</td><td>Dicemooh oleh masyarakat.</td></tr><tr><td>${N.h}</td><td>Tindak pidana menurut Pasal 362 KUHP.</td></tr></table>`),r:B(`<p>Keempat norma <b>saling melengkapi</b>. Oleh karena itu, satu tindakan dapat berkaitan dengan lebih dari satu norma.</p>`)},
{c:'5.2 Cara Menganalisis Tindakan',e:['🔍','🧠'],l:B(`<p>Untuk mengetahui norma yang mendasari suatu tindakan sesuai norma, lakukan langkah berikut.</p><ol><li>Tentukan tindakan yang akan dianalisis, misalnya <i>tidak menyerobot antrean</i>.</li><li>Tanyakan: <b>apa dasar tindakan itu</b>?<ol class="a"><li>Perintah atau larangan Tuhan: norma agama.</li><li>Suara hati nurani: norma kesusilaan.</li><li>Kebiasaan yang diterima masyarakat: norma kesopanan.</li><li>Aturan tertulis dari lembaga yang berwenang: norma hukum.</li></ol></li></ol>`),r:B(`<ol style="counter-reset:n 2"><li>Tanyakan: <b>apa akibatnya apabila tindakan itu dilanggar</b>?<ol class="a"><li>Dosa: norma agama.</li><li>Rasa bersalah, malu, takut, atau menyesal: norma kesusilaan.</li><li>Ditegur, dicemooh, atau dikucilkan: norma kesopanan.</li><li>Sanksi tegas: norma hukum.</li></ol></li><li>Apabila lebih dari satu jawaban sesuai, tindakan tersebut berkaitan dengan lebih dari satu norma.</li></ol><p><b>Contoh:</b> menyerobot antrean membuat pelakunya ditegur oleh orang di sekitarnya, sehingga tindakan tidak menyerobot berkaitan dengan norma kesopanan.</p>`)},
{c:'Bab 6 Tahu, Mampu, dan Mau',e:['💡','💪','❤️'],l:B(`<h3>6.1 Tiga Tahap Menerapkan Norma</h3><ol><li><b>Tahu</b>: memahami norma yang berlaku beserta sanksinya. Contoh: antre termasuk norma kesopanan; menyerobot akan ditegur.</li><li><b>Mampu</b>: dapat memilih dan melakukan tindakan yang tepat pada situasi nyata. Contoh: menahan diri tidak menyerobot ketika kantin ramai dan sedang lapar.</li></ol>`),r:B(`<ol style="counter-reset:n 2"><li><b>Mau</b>: melakukannya atas kesadaran sendiri. Contoh: tetap antre walaupun tidak ada guru yang melihat.</li></ol><p>Menerapkan norma tidak berhenti pada mengetahui, tetapi berlanjut sampai mau melakukannya.</p>`)},
{c:'Bab 7 Wawasan Tambahan',e:['🌍','📚'],l:B(`<h3>7.1 Kebebasan Beribadah</h3><p>Menghormati teman yang beribadah menurut agama yang berbeda merupakan wujud norma agama, kesopanan, dan hukum, karena kebebasan beribadah dijamin oleh UUD 1945.</p>`)+B(`<h3>7.2 Keselamatan di Jalan</h3><p>Menaati lampu lalu lintas dan memakai sabuk pengaman atau helm termasuk norma hukum dengan sanksi tilang atau denda, sekaligus wujud kepedulian terhadap keselamatan sesama.</p>`),r:B(`<h3>7.3 Menghargai Karya Orang Lain</h3><p>Tidak membeli atau memakai barang bajakan, misalnya mengunduh film atau lagu ilegal, berkaitan dengan norma hukum (hak cipta) dan kesusilaan.</p>`)},
{c:'Bab 8 Peta Pemanfaatan Flipbook',e:['🗺️','🧭'],l:B(`<h3>Peta Bagian LKM</h3><table><tr><th>Bagian LKM</th><th>Halaman</th><th>Butir</th></tr><tr><td>A. Jejak Normaku</td><td>4, 9</td><td>1.3, 4.1</td></tr><tr><td>B. Dugaan Kami</td><td>3</td><td>1.2</td></tr><tr><td>C. Ciri dan Sanksi</td><td>5–8</td><td>2.2–2.4, 3.1–3.2</td></tr></table>`),r:B(`<table><tr><th>Bagian LKM</th><th>Halaman</th><th>Butir</th></tr><tr><td>D. Puzzle Norma Kita</td><td>10, 11</td><td>5.1–5.2</td></tr><tr><td>E1–E2. Tebak Normanya</td><td>9–11</td><td>4.1–4.2, 5.2</td></tr><tr><td>E3. Kesimpulan Kami</td><td>10, 11</td><td>5.1–5.2</td></tr><tr><td>F. Refleksi dan Janji Kecil</td><td>9, 12</td><td>4.2, 6.1</td></tr></table>`)},
{c:'Rangkuman',e:['✅','⭐'],l:B(`<ol><li>Norma memuat perintah, larangan, sanksi, dan bersifat mengikat.</li><li>Norma agama, kesusilaan, kesopanan, dan hukum berbeda dalam sumber dan sanksinya.</li></ol>`),r:B(`<ol style="counter-reset:n 2"><li>Satu tindakan dapat berkaitan dengan lebih dari satu norma karena keempat norma saling melengkapi.</li><li>Cara menerapkan norma boleh berbeda, tetapi nilainya sama.</li><li>Menerapkan norma melalui tahap tahu, mampu, dan mau.</li></ol>`)},
{c:'Daftar Pustaka',e:['📚'],l:B(`<ol><li>Kementerian Pendidikan, Kebudayaan, Riset, dan Teknologi. <i>Pendidikan Pancasila untuk SMP/MTs Kelas VII</i>, Bab 3 Patuh terhadap Norma, hlm. 78–86 dan 92–96.</li></ol>`),r:B(`<ol style="counter-reset:n 1"><li>Undang-Undang Dasar Negara Republik Indonesia Tahun 1945.</li><li>Kitab Undang-Undang Hukum Pidana (KUHP), Pasal 362.</li></ol>`)}
];
const T=[['Bab 1 Pendahuluan',3],['Bab 2 Arti Penting Norma',5],['Bab 3 Ciri dan Sanksi Empat Norma',7],['Bab 4 Empat Lingkungan',9],['Bab 5 Satu Tindakan, Banyak Norma',10],['Bab 6 Tahu, Mampu, dan Mau',12],['Bab 7 Wawasan Tambahan',13],['Bab 8 Peta Pemanfaatan Flipbook',14],['Rangkuman',15],['Daftar Pustaka',16]];

const $=id=>document.getElementById(id);
const tl=a=>a.map(t=>`<a href="#" data-p="${t[1]}"><span>${t[0]}</span><span>${t[1]}</span></a>`).join('');
const F=S.map((s,i)=>i==0?`<div class="cover"><p>Materi Ajar Digital</p><h1>Bertindak Sesuai Norma dalam Kehidupan Sehari-hari</h1><p>Bab 3 Patuh terhadap Norma<br>Pendidikan Pancasila Kelas VII (Fase D)</p><p style="margin-top:24px">Geser, ketuk tombol, atau gunakan panah keyboard untuk membuka halaman berikutnya.</p></div>`:i==1?`<div class="pg"><h2>Daftar Isi</h2><div class="toc">${tl(T)}</div></div>`:`<div class="pg"><h2>${s.c}</h2>${s.l}${s.r}</div>`);
F.push(`<div class="pg"><h2>Penutup</h2><p>Terima kasih telah mempelajari flipbook ini.</p><p>Norma diterapkan melalui tiga tahap: tahu, mampu, dan mau. Biasakan satu tindakan sesuai norma setiap hari, di rumah, di sekolah, dan di lingkungan sekitar.</p></div>`,`<div class="cover" style="align-items:center;text-align:center"><h1 style="font-size:1.6rem">Selamat Belajar</h1><p>Patuhi norma dengan tahu, mampu, dan mau.</p><p style="margin-top:30px;font-size:.85rem">Pendidikan Pancasila Kelas VII<br>SMPN 34 Surabaya</p></div>`);
const book=$('book'),st=$('stage');let cur=0,single=false,leaves=[];
function fix(){const m=innerWidth<=760;const h=Math.min(innerHeight-130,680);const w=m?Math.min(innerWidth-28,430):Math.min((innerWidth-40)/2,440);const r=document.documentElement.style;r.setProperty('--w',w+'px');r.setProperty('--h',Math.max(h,320)+'px');return m}
function build(){single=fix();book.innerHTML='';leaves=[];const n=single?F.length:F.length/2;
for(let i=0;i<n;i++){const l=document.createElement('div');l.className='leaf';const a=single?i:2*i,b=single?null:2*i+1;
l.innerHTML=`<div class="face fr">${F[a]}</div>${b!==null?`<div class="face bk">${F[b]}</div>`:''}`;book.appendChild(l);leaves.push(l)}
cur=Math.min(cur,single?F.length-1:F.length/2);go(cur)}
function go(c){const n=leaves.length;cur=Math.max(0,Math.min(single?n-1:n,c));leaves.forEach((l,i)=>{l.classList.toggle('f',i<cur);l.style.zIndex=i<cur?i:n-i});
book.style.transform=single?'':(cur==0?'translateX(-25%)':cur==n?'translateX(25%)':'');
const p=single?cur+1:(cur==0?1:cur==n?F.length:(2*cur)+'–'+(2*cur+1));
$('pi').textContent='Halaman '+p+' dari '+F.length;$('pv').disabled=cur==0;$('nx').disabled=cur>=(single?n-1:n)}
function page(p){go(single?p-1:Math.ceil((p-1)/2))}
$('nx').onclick=()=>go(cur+1);$('pv').onclick=()=>go(cur-1);$('toc').onclick=()=>page(2);
let dk=matchMedia('(prefers-color-scheme:dark)').matches;$('th').onclick=()=>{dk=!dk;document.documentElement.dataset.theme=dk?'dark':'light';document.documentElement.style.colorScheme=dk?'dark':'light'};
